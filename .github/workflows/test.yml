name: CI
on: 
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # STEP 1: Informasi Sistem & OS
      - name: System & OS Info
        run: |
          echo "===== SYSTEM & OS ====="
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo ""
      
      # STEP 2: Identifikasi Jaringan
      - name: Network Info
        run: |
          echo "===== NETWORK ====="
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo ""
      
      # STEP 3: Akses Direktori & File
      - name: Directory & File Info
        run: |
          echo "===== DIRECTORY & FILE ====="
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo ""
      
      # STEP 4: Menemukan Program/Tools
      - name: Tools Info
        run: |
          echo "===== TOOLS ====="
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo ""
      
      # STEP 5: Memeriksa Privilege
      - name: Privilege Info
        run: |
          echo "===== PRIVILEGE ====="
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo ""